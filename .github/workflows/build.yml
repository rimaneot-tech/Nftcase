steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check ZIP archive
    run: |
      test -f "nftcase_fixed_v2.zip" || {
        echo "ERROR: nftcase_fixed_v2.zip was not found in the repository root."
        echo "Upload the ZIP file to the top level of the GitHub repository."
        exit 1
      }
      unzip -t "nftcase_fixed_v2.zip"

  - name: Unzip NFTCase Fixed V2
    run: |
      mkdir -p project
      unzip -o "nftcase_fixed_v2.zip" -d project
      test -f "project/settings.gradle.kts" || {
        echo "ERROR: settings.gradle.kts was not found after extracting the ZIP."
        echo "The archive must contain the Android project files at its root."
        exit 1
      }
      test -f "project/app/build.gradle.kts"

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle 8.7
    uses: gradle/actions/setup-gradle@v3
    with:
      gradle-version: '8.7'

  - name: Build debug APK
    working-directory: project
    run: gradle --no-daemon --stacktrace assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: nftcase-fixed-v2-apk
      path: project/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
