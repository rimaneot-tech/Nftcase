
name: Build NFTCase APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract NFTCase
        run: |
          mkdir -p NFTCase
          unzip -oq nftcase.zip -d NFTCase

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: NFTCase
        run: gradle assembleDebug --no-daemon

      - name: Locate APK
        run: |
          find NFTCase -type f -name "*.apk" -print
          find NFTCase -type f -name "*.apk" -exec cp {} NFTCase.apk \;
          test -f NFTCase.apk

      - name: Upload NFTCase APK
        uses: actions/upload-artifact@v4
        with:
          name: NFTCase-APK
          path: NFTCase.apk
          if-no-files-found: error
          
